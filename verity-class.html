<!-- =====================================================================
     EDIT HERE: everything you need to change lives in this one block.

     TRANSLATING: any line of text can be a plain string OR an object with
     one entry per language, e.g.   say:{ en:'Hello!', tl:'Kumusta!' }
     To add a language, add it to "languages", then add it to each line you
     want translated and to "ui" (buttons and labels). Anything missing falls
     back to the default "lang". Press L in the page to switch language.
     Keep quiz options in the same order in every language.

     TYPEWRITER: typeSpeed is milliseconds per letter (0 turns it off).
     Enter, Z or X (or clicking the speech bubble) skips to the end of a line.

     deck types:
       title  -> { type:'title',  title, sub }
       lesson -> { type:'lesson', title, text, bullets:[...], c:'#hexcolor', say }
       quiz   -> { type:'quiz', q, options:[...], answer:<index, starts at 0>,
                   hints:[first hint, second hint, ...], explain, say }
       game rounds: add  game:true, round:'Round 1: Pagpili'  to a quiz question
                    (one try, +1 point for the team whose turn it is; the yellow
                    ball shows the answer and explanation).
       match  -> { type:'match', game:true, round, q, choices:[...],
                   pairs:[[text, index of correct choice], ...], explain }
       end    -> { type:'end', title, sub }   ({score} and {total} are filled in)
     Wrong answer = Verity gives the next hint. Reorder or add slides freely.
     Music: save your song next to this file as verity_theme.ogg (or change the
     name in musicUrl below). If the file isn't found, the built-in tune
     plays instead. Set musicUrl:'' to always use the built-in tune.
     ===================================================================== -->

<style>
:root{
  --grass:#5b9b34; --grass-d:#477a28; --dirt:#86613f;
  --panel:#c6c6c6; --ink:#3b3b3b; --slot:#8b8b8b; --w:64px;
  --px:'Press Start 2P',ui-monospace,Consolas,monospace;
  --body:'VT323',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(#5f8fe0,#a7c9ff 75%);font-family:var(--body);font-size:clamp(20px,2.5vw,30px);line-height:1.25;color:var(--ink)}

.cloud{position:fixed;left:-320px;width:72px;height:24px;background:#fff;opacity:.85;
  box-shadow:24px -24px #fff,48px -24px #fff,96px 24px #fff,72px 24px #fff,120px 24px #fff;
  animation:drift var(--t) linear infinite;animation-delay:var(--d)}
@keyframes drift{to{transform:translateX(calc(100vw + 640px))}}
.sun{position:fixed;top:8vh;right:18vw;width:60px;height:60px;background:#fff7a8;box-shadow:0 0 0 8px rgba(255,247,168,.4),0 0 0 20px rgba(255,247,168,.2)}
.hills{position:fixed;left:0;right:0;bottom:19vh;height:17vh;background:#4f9a55;
  clip-path:polygon(0 70%,8% 70%,8% 40%,20% 40%,20% 60%,33% 60%,33% 25%,46% 25%,46% 55%,60% 55%,60% 35%,74% 35%,74% 65%,88% 65%,88% 30%,100% 30%,100% 100%,0 100%)}
.hills.far{height:24vh;background:#8fc08a;
  clip-path:polygon(0 50%,12% 50%,12% 20%,28% 20%,28% 45%,42% 45%,42% 10%,58% 10%,58% 40%,72% 40%,72% 18%,90% 18%,90% 50%,100% 50%,100% 100%,0 100%)}
.tree{position:fixed;bottom:calc(19vh - 6px);width:20px;height:64px;background:#6b4a2e;box-shadow:inset -5px 0 rgba(0,0,0,.25);transform:scale(var(--s,1));transform-origin:bottom center}
.tree::before{content:'';position:absolute;left:-32px;top:-46px;width:84px;height:60px;
  background:conic-gradient(rgba(0,0,0,.15) 25%,transparent 0 50%,rgba(0,0,0,.15) 0 75%,transparent 0) 0 0/12px 12px,#3c8c34;box-shadow:inset -6px -6px rgba(0,0,0,.2)}
.mob{position:fixed;bottom:calc(19vh - 4px);left:-100px;width:44px;height:26px;background:var(--b);animation:roam var(--t) linear infinite;animation-delay:var(--d)}
.mob::before{content:'';position:absolute;right:-18px;top:-8px;width:22px;height:22px;background:var(--h,var(--b));box-shadow:inset -4px -4px rgba(0,0,0,.18)}
.mob::after{content:'';position:absolute;left:4px;bottom:-10px;width:8px;height:12px;background:var(--l);box-shadow:26px 0 var(--l);animation:legs .5s steps(1) infinite}
.pig{--b:#f2a8b0;--l:#d98a95}
.cow{--b:#5a3d28;--h:#6b4a2e;--l:#3b281a;background:linear-gradient(90deg,#5a3d28 25%,#f1f1f1 25% 42%,#5a3d28 42% 68%,#f1f1f1 68% 80%,#5a3d28 80%)}
.mob.rev{left:auto;right:-100px;transform:scaleX(-1);animation-name:roam-l}
@keyframes roam{to{transform:translateX(calc(100vw + 220px))}}
@keyframes roam-l{from{transform:scaleX(-1)}to{transform:scaleX(-1) translateX(calc(100vw + 220px))}}
@keyframes legs{50%{transform:translateX(3px)}}
.flowers{position:fixed;left:3vw;bottom:19vh;width:10px;height:10px;background:#e03a3a;box-shadow:14vw 0 #f5d142,29vw 0 #e03a3a,43vw 0 #fff,57vw 0 #f5d142,71vw 0 #e03a3a,86vw 0 #6aa8ff,94vw 0 #f5d142}
.ores{position:fixed;left:4vw;bottom:8vh;width:14px;height:14px;background:#1c1c1c;
  box-shadow:5vw 22px #1c1c1c,14vw -18px #d8af93,22vw 12px #d8af93,29vw -14px #1c1c1c,68vw 10px #e03030,76vw -16px #d8af93,85vw 18px #1c1c1c,93vw -12px #e03030}
.dia{position:fixed;left:9vw;bottom:5vh;width:14px;height:14px;background:#4de3d6;box-shadow:80vw 14px #4de3d6,36vw 30px #4de3d6;animation:tw 2.4s steps(1) infinite}
@keyframes tw{50%{opacity:.35}}
.ground{position:fixed;left:0;right:0;bottom:0;height:19vh;
  background:linear-gradient(var(--grass) 0 26%,var(--grass-d) 26% 33%,transparent 33%),
  conic-gradient(rgba(0,0,0,.08) 25%,transparent 0 50%,rgba(0,0,0,.08) 0 75%,transparent 0) 0 0/32px 32px,var(--dirt)}

.hud{position:fixed;top:14px;font-family:var(--px);font-size:11px;color:#fff;text-shadow:2px 2px #3a3a3a;z-index:5;background:none;border:0}
.hud.l{left:16px}.hud.r{right:16px}.hud.l2{left:16px;top:38px;cursor:pointer}

.stage{position:fixed;inset:0 0 19vh 0;display:grid;place-items:center;padding:60px 4vw 10vh}
.slide{display:none;width:min(1000px,100%);max-height:100%;overflow:auto}
.slide.on{display:block;animation:in .25s steps(4)}
@keyframes in{from{transform:translateY(14px);opacity:0}}

.panel{background:var(--panel);border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:0 0 0 4px #000;padding:3vh 3vw;margin:4px}
h1,h2,h3{font-family:var(--px);font-weight:400;line-height:1.5}
h1{font-size:clamp(20px,4vw,46px);color:#fff;text-shadow:4px 4px #3a3a3a}
h2{font-size:clamp(14px,2.3vw,26px);margin-bottom:2vh;color:#2a2a2a}
h3{font-size:clamp(10px,1.4vw,15px);margin-bottom:1.2vh}
.sub{color:#fff;text-shadow:2px 2px #3a3a3a;font-size:clamp(22px,3vw,34px);margin:2vh auto 0;max-width:30ch}
.title{text-align:center}
.title .avatar{margin:0 auto 3vh}

ul.pts{list-style:none;margin-top:1.6vh}
ul.pts li{display:flex;gap:14px;align-items:center;margin:1.2vh 0}
ul.pts li::before{content:'';width:20px;height:20px;flex:none;background:var(--c);box-shadow:inset -4px -4px rgba(0,0,0,.28),inset 4px 4px rgba(255,255,255,.22),0 0 0 2px #000}

/* Verity */
.avatar{display:grid;grid-template-columns:repeat(8,1fr);flex:none;box-shadow:0 0 0 4px #000}
.avatar i{display:block}
.avatar.pic{display:block;box-shadow:none}
.avatar.pic img{display:block;width:100%;height:100%;object-fit:contain}
.teach{display:flex;gap:18px;align-items:flex-end;margin-top:2.4vh}
.bubble{position:relative;flex:1;background:#fff;border:4px solid #000;padding:10px 16px;color:#222}
.bubble::before{content:'';position:absolute;left:-11px;bottom:16px;width:14px;height:14px;background:#fff;border-left:4px solid #000;border-bottom:4px solid #000;transform:rotate(45deg)}
.bubble b{font-weight:400;color:#a02a2a}

.tx .b{visibility:hidden}
.bubble{cursor:pointer}
.bubble.done::after{content:'▼';position:absolute;right:10px;bottom:4px;font-size:.6em;color:#a02a2a;animation:bl .8s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.avatar.talk{animation:talk .24s steps(1) infinite}
@keyframes talk{50%{transform:translateY(-4px)}}
.hud.l3{left:16px;top:62px;cursor:pointer}

#score{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:none;gap:10px;z-index:5;font-family:var(--px);font-size:11px}
#score.on{display:flex}
#score .tm{background:#222;color:#fff;border:3px solid #000;padding:6px 10px;opacity:.75;white-space:nowrap}
#score .tm.turn{opacity:1;outline:3px solid #ffe14d;background:#3a3a3a}
.match{display:grid;gap:10px;margin-bottom:2vh}
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#a9a9a9;border:3px solid;border-color:#555 #fff #fff #555;padding:6px 10px}
.mrow select{font:inherit;padding:4px 8px;background:#000;color:#fff;border:3px solid;border-color:#555 #ddd #ddd #555}
.mrow.right{background:#8fcf6a}.mrow.wrong{background:#e08a8a}
.avatar[title]{cursor:pointer}

.crow{display:flex;gap:14px;align-items:center;margin:.9vh 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));column-gap:2.5vw}
.keys{display:flex;gap:6px;flex:none;min-width:7.5em}
kbd{font-family:var(--px);font-size:.5em;color:#fff;background:#6f6f6f;border:3px solid;border-color:#bbb #333 #333 #bbb;box-shadow:0 0 0 3px #000;padding:6px 9px;min-width:2.4em;text-align:center;text-shadow:2px 2px #333}

/* Scrolling world (marquee) and the walking player */
.layer{position:fixed;left:-60px;bottom:19vh;width:300vw;height:0;display:flex;animation:scroll var(--t) linear infinite}
.cp{position:relative;flex:none;width:100vw;height:0}
@keyframes scroll{to{transform:translateX(-33.3333%)}}
.hl{position:absolute;left:0;right:0;bottom:0;height:17vh;background:#4f9a55;
  clip-path:polygon(0 70%,8% 70%,8% 40%,20% 40%,20% 60%,33% 60%,33% 25%,46% 25%,46% 55%,60% 55%,60% 35%,74% 35%,74% 65%,88% 65%,88% 70%,100% 70%,100% 100%,0 100%)}
.hl.far{height:24vh;background:#8fc08a;
  clip-path:polygon(0 50%,12% 50%,12% 20%,28% 20%,28% 45%,42% 45%,42% 10%,58% 10%,58% 40%,72% 40%,72% 18%,90% 18%,90% 50%,100% 50%,100% 100%,0 100%)}
.layer .tree{position:absolute;bottom:-6px}
.layer .flowers{position:absolute;bottom:0}
.ground{animation:gscroll var(--gt,1s) linear infinite}
@keyframes gscroll{to{background-position:0 0,-32px 0,0 0}}
#player{position:fixed;left:22vw;bottom:calc(19vh - 6px);animation:pbob .5s steps(1) infinite}
@keyframes pbob{50%{transform:translateY(-2px)}}
#player .pt{position:absolute}
#player .leg{transform-origin:50% 0;animation:legA .5s steps(2) infinite alternate}
#player .leg.b{animation-name:legB}
@keyframes legA{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes legB{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.calm .layer,.calm .ground,.calm #player,.calm #player .leg,.calm .cloud,.calm .mob,.calm .mob::after,.calm .dia{animation:none}
.calm .cloud,.calm .mob,.calm .mob.rev{left:var(--x);right:auto}

/* Quiz */
.board{background:#2f4a3a;color:#fff;border:6px solid #8a6a3c;box-shadow:0 0 0 3px #000;padding:2.2vh 2vw;margin-bottom:2vh;font-size:1.15em}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opt,.send{font:inherit;color:#fff;text-shadow:2px 2px #333;text-align:left;cursor:pointer;background:#6f6f6f;
  border:3px solid;border-color:#bbb #333 #333 #bbb;box-shadow:0 0 0 3px #000;padding:8px 14px;display:flex;gap:12px}
.opt b{font-family:var(--px);font-weight:400;font-size:.55em;align-self:center;opacity:.8}
.opt:hover:not(:disabled),.send:hover:not(:disabled){background:#7d86c9}
.opt:disabled,.send:disabled{cursor:default}
.open{display:flex;gap:12px}
.ans{flex:1;min-width:0;font:inherit;color:#fff;background:#000;padding:8px 12px;border:3px solid;border-color:#373737 #fff #fff #373737;box-shadow:0 0 0 3px #000}
.ans:disabled{opacity:.7}
.opt.wrong{background:#a02a2a;opacity:.75}
.opt.right{background:var(--grass)}

/* Hotbar */
.hotbar{position:fixed;left:50%;bottom:3.5vh;transform:translateX(-50%);display:flex;padding:4px;background:#222;border:4px solid #000;z-index:5}
.slot{width:var(--w);aspect-ratio:1;background:var(--slot);border:3px solid;border-color:#373737 #fff #fff #373737;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .blk{width:56%;height:56%;background:var(--c);box-shadow:inset -4px -4px rgba(0,0,0,.28),inset 4px 4px rgba(255,255,255,.22)}
.slot span{position:absolute;right:3px;bottom:2px;font-family:var(--px);font-size:9px;color:#fff;text-shadow:1px 1px #000}
.slot.sel{outline:5px solid #fff;outline-offset:-1px;box-shadow:0 0 0 4px #000;z-index:1}
.name{position:fixed;left:0;right:0;bottom:calc(3.5vh + var(--w) + 30px);text-align:center;font-family:var(--px);font-size:13px;color:#fff;text-shadow:2px 2px #3a3a3a;z-index:5;pointer-events:none;opacity:0}
.name.show{animation:nm 2.6s forwards}
@keyframes nm{0%,70%{opacity:1}100%{opacity:0}}

:focus-visible{outline:4px solid #ffe14d;outline-offset:2px}
.calm .slide.on,.calm .name.show,.calm .avatar.talk,.calm .bubble.done::after,.calm .opt.wrong,.calm .opt.right,.calm .avatar.pic img.sw{animation:none}
.calm .name.show{opacity:1}
.calm .slot,.calm .opt,.calm .send,.calm #score .tm{transition:none}

/* Smooth, springy interactions */
.slide.on{animation:in .5s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,0px)) translateY(10px) scale(.985)}}
.slot{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.slot:hover{transform:translateY(-3px)}
.slot.sel{transform:translateY(-6px) scale(1.1)}
.slot .blk{transition:background .5s ease}
.opt,.send{transition:background .18s ease,transform .22s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.opt:hover:not(:disabled),.send:hover:not(:disabled){transform:translateY(-2px)}
.opt:active:not(:disabled),.send:active:not(:disabled){transform:translateY(1px) scale(.99)}
.opt.wrong{animation:shake .4s ease}
.opt.right{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{40%{transform:scale(1.04)}}
#score .tm{transition:opacity .3s,background .3s,outline-color .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
#score .tm.turn{transform:translateY(2px) scale(1.06)}
.avatar.pic img.sw{animation:swap .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes swap{from{opacity:.2;transform:scale(.7) rotate(-8deg)}}
/* Mouse parallax (the offsets are lerped in JS) */
.layer.far{translate:calc(var(--px,0) * -10px) 0}
.layer.mid{translate:calc(var(--px,0) * -18px) 0}
.layer.fg{translate:calc(var(--px,0) * -30px) 0}
#player{translate:calc(var(--px,0) * 8px) 0}
</style>

  let LANG = new URLSearchParams(location.search).get('lang') || CONFIG.lang;
  if (!CONFIG.languages[LANG]) LANG = CONFIG.lang;
  document.documentElement.lang = LANG;
  const tr = x => (x && typeof x === 'object' && !Array.isArray(x)) ? (x[LANG] ?? x[CONFIG.lang] ?? Object.values(x)[0]) : x;

    },
    start(){
      if (this.started) return; this.started = true;
      const c = this.ctx(); this.master = c.createGain(); this.master.gain.value = .5; this.master.connect(c.destination);
      if (CONFIG.musicUrl){
        const el = this.el = new Audio(CONFIG.musicUrl); el.loop = true; el.volume = .8;
        const fallback = () => { this.el = null; this.synth(); };
        el.addEventListener('error', fallback, {once:true});
        el.play().catch(e => { if (e.name !== 'NotAllowedError') fallback(); });
      } else this.synth();
      this.label();
    },
    synth(){
      if (this.synthOn) return; this.synthOn = true;
      const c = this.ctx();
      {
        this.next = c.currentTime + .1;
        setInterval(() => {
          while (this.next < c.currentTime + .3){
            const k = this.step % MEL.length;
            if (MEL[k]) this.tone(hz(MEL[k]), this.next, 1.4, 'triangle', .16);
            if (BASS[k]) this.tone(hz(BASS[k]), this.next, 2.2, 'sine', .2);
            this.next += .45; this.step++;
          }
        }, 50);
      }
      this.label();
    },
    toggle(){
      this.on = !this.on;
      this.master.gain.setTargetAtTime(this.on ? .5 : 0, this.ctx().currentTime, .05);
      if (this.el) this.on ? this.el.play() : this.el.pause();
      this.label();
    },
    label(){ $('#mus').textContent = ui(!this.started ? 'musicStart' : this.on ? 'musicOn' : 'musicOff'); },
    blip(){
      if (!this.started || !this.on) return;
      this.tone(380 + Math.random() * 160, this.ctx().currentTime, .05, 'square', .035);
    },
    sfx(ok){
      if (!this.started || !this.on) return;
      const t = this.ctx().currentTime;
      if (ok){ this.tone(660, t, .25, 'square', .08); this.tone(880, t + .12, .35, 'square', .08); }
      else   { this.tone(150, t, .4, 'sawtooth', .1); this.tone(110, t + .15, .4, 'sawtooth', .1); }
    }
  };

  /* ---------- Verity's face (8x8 pixels) ---------- */
  const COL = {H:'#4a3222', S:'#c68c5a', G:'#1b1b1b', M:'#7a3b2e'};
  const FACE = ['HHHHHHHH','HHHHHHHH','HSSSSSSH','SGGSSGGS','SSSSSSSS','','','SSSSSSSS'];
  const MOUTH = {
    happy:['SMSSSSMS','SSMMMMSS'], sad:['SSMMMMSS','SMSSSSMS'], neutral:['SSSSSSSS','SSMMMMSS']
  };
  function pixels(a){
    a.className = 'avatar'; a.textContent = '';
    for (let n = 0; n < 64; n++) a.appendChild(document.createElement('i'));
    a.mood = m => {
      const rows = FACE.slice(); rows[5] = MOUTH[m][0]; rows[6] = MOUTH[m][1];
      [...a.children].forEach((p, n) => p.style.background = COL[rows[n >> 3][n & 7]]);
    };
  }
  const SPRITES = []; let lastSprite = null;
  (CONFIG.sprites || []).forEach(u => { const m = new Image(); m.onload = () => SPRITES.push(u); m.src = u; });
  function nextSprite(ball){
    const pool = (CONFIG.useBall === false ? [] : [ball]).concat(SPRITES);
    if (!pool.length) return ball;
    let c; do { c = pool[Math.random() * pool.length | 0]; } while (pool.length > 1 && c === lastSprite);
    return (lastSprite = c);
  }
  function avatar(px){
    const a = document.createElement('div');
    a.style.width = a.style.height = px + 'px';
    const imgs = CONFIG.teacherImages || {}, first = imgs.happy || imgs.neutral || imgs.sad;
    if (!first){ pixels(a); a.mood('neutral'); return a; }
    a.className = 'avatar pic';
    const im = document.createElement('img'); im.alt = ''; a.appendChild(im);
    im.onerror = () => { pixels(a); a.mood(a.cur || 'neutral'); };
    a.mood = m => { a.cur = m; im.src = nextSprite(imgs[m] || imgs.happy || first); im.classList.remove('sw'); void im.offsetWidth; im.classList.add('sw'); };
    a.mood('neutral'); return a;
  }
  const SPEED = CONFIG.typeSpeed ?? 35;
  function speak(s, text, mood, instant){
    clearTimeout(s.tm);
    const box = s.bub || s.tx, a = s.tx.querySelector('.a'), b = s.tx.querySelector('.b');
    s.line = {text, mood}; s.av.mood(mood || 'neutral');
    box.classList.remove('done');
    const fin = () => {
      clearTimeout(s.tm); a.textContent = text; b.textContent = '';
      box.classList.add('done'); s.av.classList.remove('talk'); s.typing = false;
    };
    s.skip = fin;
    if (instant || !SPEED) return fin();
    let n = 0; s.typing = true; s.av.classList.add('talk');
    const step = () => {
      n++; a.textContent = text.slice(0, n); b.textContent = text.slice(n);
      const ch = text[n - 1], nx = text[n];
      if (ch !== ' ') Music.blip();
      if (n >= text.length) return fin();
      const gap = (!nx || nx === ' ') ? (/[.!?…]/.test(ch) ? 280 : /[,;:]/.test(ch) ? 140 : 0) : 0;
      s.tm = setTimeout(step, SPEED + gap);
    };
    step();
  }
  // Types the slide's current line the first time it is shown, then shows it instantly
  function enter(s){
    s.enter = () => { const L = s.line; speak(s, L.text, L.mood, s.seen); s.seen = true; };
  }
  function teacher(s, text){
    const row = document.createElement('div'); row.className = 'teach';
    s.av = avatar(72);
    s.bub = document.createElement('div'); s.bub.className = 'bubble';
    s.bub.innerHTML = '<b>' + esc(T) + ':</b> <span class="tx"><span class="a"></span><span class="b"></span></span>';
    s.tx = s.bub.querySelector('.tx');
    s.bub.addEventListener('click', () => { if (s.typing) s.skip(); });
    s.av.addEventListener('click', () => { if (s.reveal) s.reveal(); });
    row.append(s.av, s.bub); s.querySelector('.panel').appendChild(row);
    s.say = (t, mood) => speak(s, t, mood);
    s.line = {text: text || ui('learn'), mood: 'neutral'}; enter(s);
  }

  /* ---------- Build slides ---------- */
  const stage = $('#stage'), hotbar = $('#hotbar'), nameEl = $('#name'), countEl = $('#count');
  const total = DECK.filter(d => d.type === 'quiz' && !d.game).length;
  const picks = [], results = {}, wins = {}, teams = CONFIG.teams || [];
  let gi = 0;
  let qn = 0, i = 0;
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const slides = DECK.map((d, k) => {
    const s = document.createElement('section');
    s.className = 'slide' + (d.type === 'title' || d.type === 'end' ? ' title' : '');
    let label = tr(d.title) || ui('question'), color = d.c || '#5cbf4f';

    if (d.type === 'title' || d.type === 'end'){
      s.av = avatar(144); s.av.mood('happy'); s.appendChild(s.av);
      s.insertAdjacentHTML('beforeend', '<h1>' + esc(tr(d.title)) + '</h1><p class="sub"><span class="a"></span><span class="b"></span></p>');
      s.tx = s.querySelector('.sub');
      s.line = {text: tr(d.sub), mood: 'happy'}; enter(s);
      if (d.type === 'title') label = ui('classStarts');
      if (d.type === 'end'){ label = ui('classDismissed'); color = '#f5d142';
        s.update = () => {
          const n = Object.values(results).filter(r => r === 'first').length;
          const t = tr(d.sub).replace('{score}', n).replace('{total}', total);
          if (t !== s.line.text) s.seen = false;
          s.line = {text: t, mood: n >= total / 2 ? 'happy' : 'neutral'};
        };
      }
    }
    else if (d.type === 'lesson'){
      s.innerHTML = '<div class="panel"><h2>' + esc(tr(d.title)) + '</h2><p>' + esc(tr(d.text) || '') + '</p>' +
        '<ul class="pts" style="--c:' + color + '">' + (d.bullets || []).map(b => '<li>' + esc(tr(b)) + '</li>').join('') + '</ul></div>';
      teacher(s, tr(d.say));
    }
    else if (d.type === 'quiz'){
      if (!d.game) qn++;
      if (d.game){ s.turn = gi++ % Math.max(1, teams.length); s.dataset.game = '1'; }
      label = d.game ? tr(d.round) : ui('question') + ' ' + qn; color = '#f5d142';
      const head = d.game ? tr(d.round) + (teams.length ? ' · ' + ui('turn') + ' ' + teams[s.turn] : '') : ui('question') + ' ' + qn + ' ' + ui('of') + ' ' + total;
      s.innerHTML = '<div class="panel"><h3>' + esc(head) + '</h3><div class="board">' + esc(tr(d.q)) + '</div>' +
        '<div class="opts">' + (d.options || []).map((o, j) => '<button class="opt"><b>' + (j + 1) + '</b>' + esc(tr(o)) + '</button>').join('') + '</div></div>';
      if (d.keywords) s.querySelector('.opts').outerHTML = '<div class="open"><input class="ans" type="text" maxlength="140" autocomplete="off" placeholder="' +
        esc(ui('typeHere')) + '"><button class="send">' + esc(ui('send')) + '</button></div>';
      teacher(s, tr(d.say) || ui('take'));
      const btns = [...s.querySelectorAll('button.opt')], inp = s.querySelector('.ans');
      let wrong = 0, done = false;
      const finish = (ok, el) => {
        done = true; if (el) el.classList.add('right');
        btns.forEach(b => b.disabled = true);
        if (inp){ inp.disabled = true; s.querySelector('.send').disabled = true; }
        s.say((d.game ? (ok ? ui('correct') : ui('wrongAns')) + ' ' : '') + (tr(d.explain) || ui('correct')), ok ? 'happy' : 'neutral');
        if (ok){ Music.sfx(true); Motion.kick(2.2); }
        const res = ok && wrong === 0 ? 'first' : 'hinted';
        if (d.game){ if (ok) wins[k] = s.turn; scoreUpdate(); } else results[k] = res;
        slotColor(k, res === 'first' ? '#5b9b34' : '#e8913a');
      };
      const miss = el => {
        Motion.kick(-1.2); wrong++; if (el){ el.classList.add('wrong'); el.disabled = true; }
        const hs = d.hints || [];
        if (d.game){ Music.sfx(false); return finish(false, inp ? null : btns[d.answer]); }
        if (inp && wrong > hs.length) return finish(false);   // out of hints: show the sample answer
        const h = hs.length ? ui('hint') + ' ' + tr(hs[Math.min(wrong - 1, hs.length - 1)]) : ui('tryAgain');
        s.say(ui('notQuite') + ' ' + h, 'sad'); Music.sfx(false);
      };
      if (inp){
        const send = () => {
          const v = norm(inp.value.trim()); if (!v || done) return;
          d.keywords.some(w => v.includes(norm(w))) ? finish(true) : miss();
        };
        s.querySelector('.send').addEventListener('click', send);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
        s.focusInput = () => inp.focus();
        picks[k] = null;
      } else {
        const pick = j => {
          if (done || btns[j].disabled) return;
          j === d.answer ? finish(true, btns[j]) : miss(btns[j]);
        };
        btns.forEach((b, j) => b.addEventListener('click', () => pick(j)));
        picks[k] = pick;
      }
      s.reveal = () => { if (!done) finish(false, inp ? null : btns[d.answer]); };
      s.av.title = ui('ballTip'); s.av.style.cursor = 'pointer';
    }
    else if (d.type === 'match'){
      s.turn = gi++ % Math.max(1, teams.length); s.dataset.game = '1'; label = tr(d.round); color = '#f5d142';
      const head = tr(d.round) + (teams.length ? ' · ' + ui('turn') + ' ' + teams[s.turn] : '');
      const ch = d.choices.map(tr);
      s.innerHTML = '<div class="panel"><h3>' + esc(head) + '</h3><div class="board">' + esc(tr(d.q)) + '</div><div class="match">' +
        d.pairs.map(p => '<div class="mrow"><span>' + esc(tr(p[0])) + '</span><select><option value="">—</option>' +
          ch.map((c, j) => '<option value="' + j + '">' + esc(c) + '</option>').join('') + '</select></div>').join('') +
        '</div><button class="send mchk">' + esc(ui('send')) + '</button></div>';
      teacher(s, tr(d.say) || ui('take'));
      const sels = [...s.querySelectorAll('select')], mbtn = s.querySelector('.mchk'); let done = false;
      const finish = ok => {
        done = true; mbtn.disabled = true;
        sels.forEach((sel, n) => {
          sel.parentNode.classList.add(sel.value !== '' && +sel.value === d.pairs[n][1] ? 'right' : 'wrong');
          sel.value = d.pairs[n][1]; sel.disabled = true;
        });
        s.say((ok ? ui('correct') : ui('wrongAns')) + ' ' + tr(d.explain), ok ? 'happy' : 'neutral');
        Music.sfx(ok); Motion.kick(ok ? 2.2 : -1.2); if (ok) wins[k] = s.turn; scoreUpdate(); slotColor(k, ok ? '#5b9b34' : '#e8913a');
      };
      mbtn.addEventListener('click', () => {
        if (!done && sels.every(x => x.value !== '')) finish(sels.every((x, n) => +x.value === d.pairs[n][1]));
      });
      s.reveal = () => { if (!done) finish(false); };
      s.av.title = ui('ballTip'); s.av.style.cursor = 'pointer';
    }
    else if (d.type === 'controls'){
      color = '#4de3d6'; label = tr(d.title);
      s.innerHTML = '<div class="panel"><h2>' + esc(tr(d.title)) + '</h2><div class="cgrid">' +
        d.rows.map(r => '<div class="crow"><span class="keys">' + r.keys.map(k => '<kbd>' + esc(k) + '</kbd>').join('') +
          '</span><span>' + esc(tr(r.text)) + '</span></div>').join('') + '</div></div>';
      teacher(s, tr(d.say));
    }
    s.dataset.t = label; s.dataset.c = color;
    stage.appendChild(s); return s;
  });

  const slots = slides.map((s, k) => {
    const b = document.createElement('div'); b.className = 'slot'; b.title = s.dataset.t;
    b.innerHTML = '<div class="blk" style="--c:' + s.dataset.c + '"></div><span>' + (k + 1) + '</span>';
    b.addEventListener('click', () => go(k)); hotbar.appendChild(b); return b;
  });
  const slotColor = (k, c) => slots[k].firstChild.style.setProperty('--c', c);
  const size = () => document.documentElement.style.setProperty('--w', Math.min(64, (innerWidth - 40) / slides.length - 6) + 'px');
  size(); addEventListener('resize', size);

  function scoreUpdate(){
    const sb = $('#score'); sb.textContent = '';
    const cur = slides[i] ? slides[i].turn : undefined;
    teams.forEach((t, n) => {
      const d = document.createElement('div'); d.className = 'tm' + (n === cur ? ' turn' : '');
      d.textContent = t + ': ' + Object.values(wins).filter(v => v === n).length; sb.appendChild(d);
    });
  }
  function go(n){
    const old = i;
    i = Math.max(0, Math.min(slides.length - 1, n));
    if (i !== old){ stage.style.setProperty('--dx', (i > old ? 46 : -46) + 'px'); Motion.kick(i > old ? (i - old > 1 ? 1.8 : 1.2) : -0.6); }
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    slots.forEach((s, k) => s.classList.toggle('sel', k === i));
    slides.forEach((s, k) => { if (k !== i && s.typing) s.skip(); });
    if (slides[i].update) slides[i].update();
    if (slides[i].enter) slides[i].enter();
    $('#score').classList.toggle('on', teams.length > 0 && (slides[i].dataset.game === '1' || DECK[i].type === 'end'));
    scoreUpdate();
    countEl.textContent = (i + 1) + ' / ' + slides.length;
    nameEl.textContent = slides[i].dataset.t;
    nameEl.classList.remove('show'); void nameEl.offsetWidth; nameEl.classList.add('show');
    history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---------- Controls ---------- */
  addEventListener('keydown', e => {
    const k = e.key;
    if (!Music.started){ Music.start(); if (k === 'm' || k === 'M') return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT'){ if (k === 'Escape') e.target.blur(); return; }
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' '){ e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); go(i - 1); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(slides.length - 1);
    else if (k >= '1' && k <= '9'){ if (picks[i]) picks[i](+k - 1); }
    else if (k === 'Enter' || k === 'z' || k === 'Z' || k === 'x' || k === 'X'){ const c = slides[i]; if (c.typing) c.skip(); else if (k === 'Enter' && c.focusInput){ e.preventDefault(); c.focusInput(); } }
    else if (k === 'l' || k === 'L') cycleLang();
    else if (k === 'm' || k === 'M') Music.toggle();
    else if (k === 'r' || k === 'R'){ location.hash = '#1'; location.reload(); }
    else if (k === 'f' || k === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  addEventListener('pointerdown', () => Music.start(), {once:true});
  $('#mus').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); if (!Music.started) Music.start(); else Music.toggle(); });

  let x0 = null;
  addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
  addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 60) go(i + (dx < 0 ? 1 : -1)); x0 = null;
  });

  /* ---------- Scrolling world + walking player ---------- */
  const WALK = 30;   // seconds for the foreground to scroll one screen
  function pxs(map, pal, px){
    const w = document.createElement('div'), d = document.createElement('div'), sh = [];
    w.style.width = map[0].length * px + 'px'; w.style.height = map.length * px + 'px';
    map.forEach((row, y) => [...row].forEach((c, x) => { if (pal[c]) sh.push(x * px + 'px ' + y * px + 'px 0 ' + pal[c]); }));
    d.style.cssText = 'width:' + px + 'px;height:' + px + 'px;box-shadow:' + sh.join(',');
    w.appendChild(d); return w;
  }
  function buildWorld(){
    const layer = (cls, t, inner) => { const c = '<div class="cp">' + inner + '</div>'; return '<div class="layer ' + cls + '" style="--t:' + t + 's">' + c + c + c + '</div>'; };
    const trees = [[5,1.15],[21,.9],[34,1.05],[52,1.2],[66,.85],[78,1.2],[92,.95]]
      .map(([x, k]) => '<div class="tree" style="left:' + x + 'vw;--s:' + k + '"></div>').join('');
    $('#world').innerHTML = layer('far', 180, '<div class="hl far"></div>') + layer('mid', 90, '<div class="hl"></div>') +
      layer('fg', WALK, trees + '<div class="flowers"></div>');
    document.documentElement.style.setProperty('--gt', (32 / (innerWidth / WALK)).toFixed(3) + 's');
  }
  function buildPlayer(){
    const u = Math.max(5, Math.min(9, Math.round(innerHeight / 110)));
    const P = {H:'#4a3222', S:'#c58c62', B:'#2b5fd8', T:'#1fa6b8', P:'#3a3fa0', L:'#7a7a7a'};
    const body = ['.HHHH.','.HSSSS','.HSSBS','.SSSS.','..TT..','.TTTT.','.TTTT.','.TTTT.','.PPPP.'], leg = ['PP','PP','LL'];
    const el = $('#player'); el.textContent = '';
    el.style.width = 6 * u + 'px'; el.style.height = 12 * u + 'px';
    const add = (map, x, y, cls) => { const w = pxs(map, P, u); w.className = 'pt ' + cls; w.style.left = x * u + 'px'; w.style.top = y * u + 'px'; el.appendChild(w); };
    add(leg, 1, 9, 'leg a'); add(leg, 3, 9, 'leg b'); add(body, 0, 0, '');
  }
  /* ---------- Motion: events change the speed, everything is lerped ---------- */
  const Motion = (() => {
    const MIN = .15, MAX = 4, root = document.documentElement;
    const NAMES = ['scroll','gscroll','pbob','legA','legB','drift','roam','roam-l','legs','tw'];
    let speed = 1, target = 1, applied = 1, anims = [], last = performance.now(), mx = 0, px = 0;
    const refresh = () => { anims = document.getAnimations().filter(a => NAMES.includes(a.animationName)); anims.forEach(a => { a.playbackRate = speed; }); };
    function tick(now){
      const dt = Math.min(.1, (now - last) / 1000); last = now;
      target += (1 - target) * (1 - Math.exp(-dt * .6));     // an event's effect fades back to normal speed
      speed += (target - speed) * (1 - Math.exp(-dt * 4));   // the real speed chases the target smoothly
      px += (mx - px) * (1 - Math.exp(-dt * 5));             // smoothed mouse parallax
      root.style.setProperty('--px', px.toFixed(3));
      if (Math.abs(speed - applied) > .003){ anims.forEach(a => { a.playbackRate = speed; }); applied = speed; }
      requestAnimationFrame(tick);
    }
    addEventListener('pointermove', e => { mx = (e.clientX / innerWidth - .5) * 2; });
    requestAnimationFrame(tick);
    return { kick(d){ target = Math.max(MIN, Math.min(MAX, target + d)); }, refresh };
  })();
  let rw; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { buildWorld(); buildPlayer(); requestAnimationFrame(Motion.refresh); }, 250); });

  function cycleLang(){
    const ks = Object.keys(CONFIG.languages);
    if (ks.length < 2) return;
    location.search = '?lang=' + ks[(ks.indexOf(LANG) + 1) % ks.length];
  }
  if (CONFIG.reduceMotion && matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('calm');
  buildWorld(); buildPlayer(); requestAnimationFrame(Motion.refresh);
  addEventListener('pointerdown', () => Motion.kick(.5));
  $('#hint').textContent = ui('move'); Music.label();
  $('#lang').textContent = ui('lang') + ': ' + CONFIG.languages[LANG] + ' (L)';
  $('#lang').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); cycleLang(); });

  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
