<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | Secure Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text: #f1f5f9;
                --text-muted: #94a3b8;
                --border: #334155;
            }
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .news-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border);
        }

        .news-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .news-header h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .news-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar */
        .news-container::-webkit-scrollbar { width: 5px; }
        .news-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .news-item {
            padding: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            transition: transform 0.2s;
        }

        .news-item:hover { transform: scale(1.02); }

        .news-date {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .news-title {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 6px;
            display: block;
        }

        .news-body {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin: 0;
        }

        .back-btn {
            display: block;
            margin-top: 2rem;
            text-align: center;
            padding: 0.8rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-btn:hover { opacity: 0.9; }

        .empty-news {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 2rem 0;
        }
    </style>
</head>

<body>
    <div class="news-card">
        <div class="news-header">
            <h1><span>📰</span> System News</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Latest updates and logs</p>
            <span class="badge"><strong>{{ amount }}</strong> Total News!</span>
        </div>

        <div class="news-container">
            {% if news_list %}
                {% for item in news_list %}
                <div class="news-item">
                    <span class="news-date">{{ item.date }}</span>
                    <span class="news-title">{{ item.title }}</span>
                    <p class="news-body">{{ item.content }}</p>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty-news">No news recorded yet. Check back later!</div>
            {% endif %}
        </div>

        <a href="/" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
